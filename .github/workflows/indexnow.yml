# IndexNow: 가이드·안내 글이 바뀌면 배포가 끝난 뒤 바뀐 주소(6개 언어)를 빙·네이버 등에 바로 알린다.
# 손으로 보낼 땐 Actions → IndexNow → Run workflow 에서 주소(공백으로 구분)나 "sitemap" 을 넣는다.
# 처리 스크립트: scripts/indexnow.py
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "web/src/content/**"
  workflow_dispatch:
    inputs:
      urls:
        description: '알릴 주소(공백으로 구분). "sitemap" 이면 사이트맵 전체'
        required: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cloudflare Pages 가 새 버전을 올릴 시간을 준다(보통 1분 안쪽). 배포 전에 알리면 옛 글을 가져간다.
      - name: 배포 기다리기
        if: github.event_name == 'push'
        run: sleep 180

      - name: 바뀐 글 알리기
        if: github.event_name == 'push'
        run: python3 scripts/indexnow.py --changed "${{ github.event.before }}" "${{ github.sha }}"

      - name: 직접 넣은 주소 알리기
        if: github.event_name == 'workflow_dispatch'
        env:
          URLS: ${{ inputs.urls }}
        run: |
          if [ "$URLS" = "sitemap" ]; then
            python3 scripts/indexnow.py --sitemap
          else
            python3 scripts/indexnow.py --urls $URLS
          fi
